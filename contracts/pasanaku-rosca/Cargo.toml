[package]
name = "pasanaku-rosca"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PasanakuDAO rotating savings circle (ROSCA) coordinator: contributions, urgency auctions, dividends and on-chain reputation, governed by a Sputnik DAO v2 instance."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
