[workspace]
resolver = "2"
members = ["pasanaku-rosca", "test-token", "bulk-payment", "integration-tests"]
# integration-tests needs near-sandbox (Linux/macOS only); run it explicitly with `cargo test -p integration-tests`.
default-members = ["pasanaku-rosca", "test-token", "bulk-payment"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/pasanaku-dao/pasanaku-dao"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
